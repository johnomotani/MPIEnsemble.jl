name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The 'pre' job is not allowed to fail: pre-release breakage is reported as a failed check.
        version: ['1.13', 'pre']
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64

      - uses: julia-actions/cache@v3

      - name: Check Linux tools needed by the tests
        run: |
          for cmd in setsid setpriv; do
            if ! command -v "$cmd" > /dev/null; then
              echo "::error::'$cmd' is not on PATH; the tests need util-linux"
              exit 1
            fi
          done

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1

      # The tests run the wrapper with the Python from Python_jll, which must not depend on a system Python.
      # The runner image has python3 on PATH, so the suite runs again with PATH holding only the tools the
      # tests use, and the step fails if any Python interpreter is on that PATH.
      - name: Run the tests without a system Python
        run: |
          set -euo pipefail

          restricted=$(mktemp -d "$RUNNER_TEMP/restricted-path.XXXXXX")
          for tool in julia sh setsid setpriv sleep seq cat sed dd stty; do
            src=$(type -P "$tool") || { echo "::error::'$tool' is not on PATH"; exit 1; }
            ln -s "$src" "$restricted/$tool"
          done

          python_found=""
          for name in python python3 python3.12; do
            if p=$(PATH="$restricted" type -P "$name"); then python_found="$python_found $p"; fi
          done
          for p in "$restricted"/python*; do
            if [ -e "$p" ] || [ -L "$p" ]; then python_found="$python_found $p"; fi
          done
          if [ -n "$python_found" ]; then
            echo "::error::a Python interpreter is on the restricted PATH:$python_found"
            exit 1
          fi

          PATH="$restricted"
          export PATH
          julia --project=. --check-bounds=yes -e 'using Pkg; Pkg.test()'
